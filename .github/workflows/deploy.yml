name: Deploy to VPS

# The new version is installed and built in a separate folder (.deploy/build) while the live
# CMS keeps running. If install, build or migration fails, the live CMS is not touched.
# Only a successful build is swapped in. If /api/health fails after the restart, the previous
# version is put back automatically. Lint is never run here, so lint errors never block a deploy.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-lfcs-cms
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Build, swap and restart on VPS (rolls back on failure)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 30m
          script: |
            set -euo pipefail
            # Load nvm/node if it's installed per-user
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

            APP_DIR="${{ secrets.VPS_APP_DIR || '/var/www/lfcscms' }}"
            PM2_APP="lfcs-cms"
            APP_PORT="3001"
            HEALTH_URL="http://127.0.0.1:$APP_PORT/api/health"
            STAGE="$APP_DIR/.deploy/build"
            PREV="$APP_DIR/.deploy/previous"

            # Before the swap, any failure only removes the staging folder.
            fail() {
              echo "::error::$1 - the live CMS was NOT changed and is still running."
              rm -rf "$STAGE"
              exit 1
            }

            cd "$APP_DIR"
            [ -f .env ] || fail "$APP_DIR/.env not found"

            # 1. Copy the latest main into the staging folder
            git fetch origin main
            rm -rf "$STAGE" && mkdir -p "$STAGE"
            git archive origin/main | tar -x -C "$STAGE"
            cp .env "$STAGE/.env"

            # 2. Install, build and migrate in the staging folder
            cd "$STAGE"
            # npm ci is strict about the lock file; if the server's npm version disagrees with the
            # one that wrote package-lock.json (e.g. optional @emnapi/* deps), fall back to
            # npm install. Safe: this only touches the staging folder.
            npm --version
            npm ci --no-audit --no-fund \
              || { echo "::warning::npm ci failed (lock file mismatch) - retrying with npm install"; \
                   rm -rf node_modules; npm install --no-audit --no-fund; } \
              || fail "Installing dependencies failed"
            npm run build || fail "Build failed"
            npx prisma migrate deploy || fail "Database migration failed"

            # 3. Swap in the new build, keeping the old one for rollback
            cd "$APP_DIR"
            PREV_COMMIT="$(git rev-parse HEAD)"
            rm -rf "$PREV" && mkdir -p "$PREV"
            for d in node_modules .next; do
              if [ -e "$d" ]; then mv "$d" "$PREV/$d"; fi
              mv "$STAGE/$d" "$d"
            done
            git reset --hard origin/main
            rm -rf "$STAGE"

            restart_app() {
              cd "$APP_DIR"
              if pm2 describe "$PM2_APP" >/dev/null 2>&1; then
                pm2 reload "$PM2_APP" --update-env
              else
                PORT="$APP_PORT" pm2 start npm --name "$PM2_APP" -- start
              fi
            }

            healthy() {
              for i in $(seq 1 30); do
                curl -fsS --max-time 5 "$HEALTH_URL" >/dev/null && return 0
                sleep 2
              done
              return 1
            }

            # 4. Restart and check health; roll back if the new version doesn't come up
            restart_app
            if ! healthy; then
              echo "::error::New version failed the health check. Rolling back."
              pm2 logs "$PM2_APP" --lines 80 --nostream || true
              git reset --hard "$PREV_COMMIT"
              for d in node_modules .next; do
                rm -rf "$d"
                if [ -e "$PREV/$d" ]; then mv "$PREV/$d" "$d"; fi
              done
              restart_app
              if healthy; then
                echo "Rolled back. The previous version is serving again."
              else
                echo "::error::Previous version is also unhealthy - check the server (pm2 logs $PM2_APP)."
              fi
              exit 1
            fi

            pm2 save
            echo "Deployment completed successfully."
